default:
  autoload:
    - "%paths.base%/testing/behat"

  suites:
    default:
      paths:
        - "%paths.base%/testing/behat"
      contexts:
        - Drupal\DrupalExtension\Context\DrupalContext
        - Drupal\DrupalExtension\Context\DrushContext
        - Drupal\DrupalExtension\Context\MessageContext
        - Drupal\DrupalExtension\Context\MinkContext
        - Drupal\DrupalExtension\Context\MarkupContext

  formatters:
    pretty:
      verbose: true
      paths: false
      snippets: true

  extensions:
    Drupal\DrupalExtension:
      blackbox: ~
      api_driver: "drupal"
      region_map:
        content: ".main-container"
        footer: "#footer"
        left header: "#header-left"
        right header: "#header-right"
        right sidebar: "#aside-region"
        field body: "#edit-body-wrapper"
      selectors:
        message_selector: ".messages"
        error_message_selector: ".messages.error"
        success_message_selector: ".messages.status"
        warning_message_selector: ".messages.warning"

    Behat\MinkExtension:
      # files_path: "%paths.base%/testing/behat/assets/"
      base_url: "https://[PROYECTO].lndo.site"
      default_session: browserkit
      sessions:
        browserkit:
          browserkit_http: ~
        selenium2:
          selenium2:
            wd_host: http://chromedriver:4444/wd/hub
            capabilities:
              browser: "chrome"
              nativeEvents: true
              marionette: true
              browserName: chrome
              version: "*"
              extra_capabilities:
                loggingPrefs:
                  performance: ALL
                  browser: ALL
                chromeOptions:
                  w3c: false
                  args:
                    - "--headless"
                    - "--start-maximized"
                    - "--window-size=1920,1080"
                    - "--disable-gpu"
                    - "--no-sandbox"
                    - "--disable-dev-shm-usage"
                    - "--disable-setuid-sandbox"
                    - "--disable-web-security"
                    - "--DNS-prefetch-disable"
                    - "--disable-translate"
                    - "--ignore-certificate-errors"
                    - "--test-type"
                    - "--disable-extensions"
                    - "--incognito"
                    - "--disable-infobars"
                    - "--disable-popup-blocking"
                    - "--remote-debugging-port=9222"
                    - "--allowed-ips=*"
                    - "--whitelisted-ips=*"
